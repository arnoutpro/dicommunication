<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Dicommunication</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Dicommunication</h1>
    <p class="muted">Sign in to continue.</p>
    {% if expired %}<div class="flash fail">You were signed out after a period of inactivity.</div>{% endif %}
    {% if error %}<div class="flash fail" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label>Username <input name="username" value="{{ username }}" autocomplete="username" autofocus required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
