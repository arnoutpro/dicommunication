services:
  dicommunication:
    image: ghcr.io/arnoutpro/dicommunication:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # The web UI and JSON API have no login, so they are published to the
      # loopback interface only. Set DICOMM_HTTP_BIND to 0.0.0.0 to reach the UI
      # from elsewhere on the network, and put an authenticating reverse proxy
      # in front of it when you do.
      - "${DICOMM_HTTP_BIND:-127.0.0.1}:8080:8080"
      # The MWL SCP has to be reachable for a modality to C-FIND this
      # workstation, so it stays on every interface. It only listens once
      # "Serve the web worklist over DICOM" is enabled in Configuration.
      # Set DICOMM_DICOM_BIND to pin it to one address.
      - "${DICOMM_DICOM_BIND:-0.0.0.0}:11112:11112"
    volumes:
      - ${HOME}/.dicommunication:/app/data
    environment:
      DICOMM_DATA_DIR: /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
