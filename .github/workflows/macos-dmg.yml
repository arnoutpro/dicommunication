name: macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the built DMG to this GitHub Release tag (e.g. v0.2.0). Leave empty to skip attaching.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Resolve DMG version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            python -c "from app import __version__; print(f'value={__version__}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app and DMG
        env:
          PYTHON: python
          DICOMM_SKIP_PIP: "1"
          DICOMM_DMG_VERSION: ${{ steps.version.outputs.value }}
        run: bash packaging/macos/build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: dicommunication-dmg-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          generate_release_notes: true

      - name: Attach DMG to an existing release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [[ ${#dmgs[@]} -lt 1 ]]; then
            echo "expected a DMG under dist/, found none" >&2
            exit 1
          fi
          gh release upload "${{ github.event.inputs.release_tag }}" "${dmgs[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
